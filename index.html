<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЭМИ — Детский Электромузыкальный Инструмент</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<div class="synth-container">
  <div class="wood-left"></div>
  <div class="wood-right"></div>

  <!-- Top Panel -->
  <div class="top-panel">
    <!-- EMI Logo with oval frame -->
    <div class="logo-oval">
      <span class="logo-text">ЭМИ</span>
    </div>

    <!-- Waveform Section (above staff) -->
    <div class="waveform-section">
      <div class="waveform-screen">
        <canvas id="waveformCanvas" width="280" height="110"></canvas>
      </div>
      <div class="waveform-label">ФОРМА ВОЛНЫ</div>
      <div class="waveform-buttons">
        <button class="wave-btn active" data-wave="sine" title="Синус">
          <svg viewBox="0 0 44 28">
            <path d="M2 14 Q11 2, 22 14 Q33 26, 42 14" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="wave-btn" data-wave="square" title="Квадрат">
          <svg viewBox="0 0 44 28">
            <path d="M2 20 L2 8 L12 8 L12 20 L22 20 L22 8 L32 8 L32 20 L42 20" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="wave-btn" data-wave="sawtooth" title="Пила">
          <svg viewBox="0 0 44 28">
            <path d="M2 20 L22 8 L22 20 L42 8" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Musical staff -->
    <div class="staff">
      <span class="staff-clef">𝄞</span>
      <div class="staff-line"></div>
      <div class="staff-line"></div>
      <div class="staff-line"></div>
      <div class="staff-line"></div>
      <div class="staff-line"></div>
    </div>

    <!-- Speaker Grille -->
    <div class="speaker-grille" id="speakerGrille"></div>
  </div>

  <!-- Bottom Section: Controls + Keyboard -->
  <div class="bottom-section">
    <!-- Left: Controls Panel -->
    <div class="controls-panel">
      <!-- Knobs (vertical) -->
      <div class="knobs-section">
        <div class="knob-group">
          <div class="knob" id="lrKnob" title="Баланс L/R"></div>
          <div class="knob-label">L / R</div>
          <div class="lr-indicator">
            <span id="lrL">Л</span>
            <span id="lrR">П</span>
          </div>
        </div>
        <div class="knob-group">
          <div class="knob" id="volKnob" title="Громкость"></div>
          <div class="knob-label">ГРОМК.</div>
        </div>
      </div>
    </div>

    <!-- Right: Keyboard -->
    <div class="keyboard-section">
      <div class="keys-container" id="keysContainer"></div>
    </div>
  </div>

  <div class="info-panel">ДЕТСКИЙ ЭЛЕКТРОМУЗЫКАЛЬНЫЙ ИНСТРУМЕНТ «ЭМИ»</div>
</div>

<script src="script.js"></script>
</body>
</html>
